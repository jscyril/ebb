name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Preinstalled SDK may lack compileSdk 36; no-op if present.
      - name: Ensure Android platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true
      - run: ./gradlew test assembleDebug lint
      - uses: actions/upload-artifact@v4
        with:
          name: ebb-debug-apk
          path: app/build/outputs/apk/debug/*.apk
